services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: videofetch
      POSTGRES_USER: videofetch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-videofetch_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U videofetch -d videofetch"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./services/api
    command: ["sh","-c","alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://videofetch:${POSTGRES_PASSWORD:-videofetch_dev}@postgres:5432/videofetch
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_NAME: media-downloads
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./services/api
    command: ["python","-m","app.worker_main"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://videofetch:${POSTGRES_PASSWORD:-videofetch_dev}@postgres:5432/videofetch
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_NAME: media-downloads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
